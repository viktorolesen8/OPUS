<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const STORAGE_KEY='opus-v3'; const OLD_KEYS=['opus-v2','opus_state_v2','opus-state','opus'];
const DAY_SHORT=['Søn','Man','Tir','Ons','Tor','Fre','Lør']; const DAY_FULL=['Søndag','Mandag','Tirsdag','Onsdag','Torsdag','Fredag','Lørdag']; const DAY_ICS=['SU','MO','TU','WE','TH','FR','SA'];
const TYPES={
 supplement:{label:'Kosttilskud',icon:'S',color:'#4ade80',xp:8},
 peptide:{label:'Peptid',icon:'P',color:'#5eead4',xp:10},
 skincare:{label:'Hudpleje',icon:'✦',color:'#f472b6',xp:7},
 medication:{label:'Medicin',icon:'+',color:'#60a5fa',xp:7},
 habit:{label:'Rutine',icon:'✓',color:'#a78bfa',xp:6},
 checkin:{label:'Check-in',icon:'◎',color:'#fb923c',xp:12},
 note:{label:'Note',icon:'≡',color:'#9ca7ba',xp:5}
};
const BADGES=[
 {id:'first',icon:'🌱',name:'Første skridt',desc:'Lav din første registrering',test:s=>s.entries.length>=1},
 {id:'xp100',icon:'⚡️',name:'100 XP',desc:'Optjen 100 XP',test:s=>s.profile.xp>=100},
 {id:'streak3',icon:'🔥',name:'3 dage',desc:'Hold en 3-dages streak',test:s=>computeStreak()>=3},
 {id:'perfect',icon:'🏆',name:'Perfekt dag',desc:'Fuldfør alt på en dag',test:s=>countPerfectDays()>=1},
 {id:'logs25',icon:'📚',name:'25 logs',desc:'Registrér 25 handlinger',test:s=>s.entries.filter(e=>e.status==='taken').length>=25},
 {id:'streak7',icon:'💎',name:'7 dage',desc:'Hold en 7-dages streak',test:s=>computeStreak()>=7},
 {id:'xp500',icon:'🚀',name:'500 XP',desc:'Optjen 500 XP',test:s=>s.profile.xp>=500},
 {id:'perfect5',icon:'👑',name:'Eliteuge',desc:'5 perfekte dage',test:s=>countPerfectDays()>=5},
 {id:'level10',icon:'🧬',name:'Level 10',desc:'Nå level 10',test:s=>levelInfo().level>=10}
];
let state=defaultState(),activeTab='today',libraryFilter='all',selectedDate=localDateKey(),weekOffset=0,itemCtx={id:null,presetDays:null},logCtx={item:null,scheduleTime:null,dateKey:null},toastTimer=null,pendingPhoto=null,hiddenAt=0;

function defaultState(){return {version:3,userName:'',settings:{hideInstall:false,pinHash:null},profile:{xp:0,xpHistory:[],awarded:{}},items:[],entries:[],checkins:[],createdAt:Date.now()}}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5)}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function num(v){if(v===null||v===undefined||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:null}
function clamp(n,a,b){return Math.min(b,Math.max(a,n))}
function localDateKey(ts=Date.now()){const d=ts instanceof Date?ts:new Date(ts),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function dateFromKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function startOfDay(d=new Date()){return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()}
function fmtDate(ts){return new Date(ts).toLocaleDateString('da-DK',{day:'numeric',month:'short'})}
function fmtDateLong(ts=Date.now()){return new Date(ts).toLocaleDateString('da-DK',{weekday:'long',day:'numeric',month:'long'})}
function fmtDateTime(ts){const d=new Date(ts);return `${fmtDate(ts)} · ${d.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit'})}`}
function parseTimes(raw){return [...new Set(String(raw||'').split(/[;,\s]+/).map(s=>s.trim()).filter(s=>/^([01]\d|2[0-3]):[0-5]\d$/.test(s)))].sort()}
function typeMeta(t){return TYPES[t]||TYPES.habit}
function avg(arr){const a=arr.filter(Number.isFinite);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null}
function dateEntry(e){return localDateKey(e.ts)}
function scheduleText(i){const ds=(i.days||[]).length===7?'Dagligt':(i.days||[]).map(d=>DAY_SHORT[d]).join(', ')||'Ingen dage';return `${ds}${i.times?.length?' · '+i.times.join(' · '):' · frit tidspunkt'}`}

function normalizeState(raw){
 const base=defaultState(); if(!raw||typeof raw!=='object')return base;
 if(raw.version===3){return {...base,...raw,settings:{...base.settings,...raw.settings},profile:{...base.profile,...raw.profile,awarded:{...(raw.profile?.awarded||{})},xpHistory:raw.profile?.xpHistory||[]},items:raw.items||[],entries:raw.entries||[],checkins:raw.checkins||[]}}
 if(raw.version===2&&Array.isArray(raw.items)){
   const out={...base,userName:raw.userName||'',settings:{...base.settings,...raw.settings},profile:{...base.profile,xp:raw.profile?.xp||0},items:raw.items||[],entries:raw.entries||[],checkins:raw.checkins||[],createdAt:raw.createdAt||Date.now()};
   return out;
 }
 const out=base; out.userName=raw.charName||raw.userName||''; out.profile.xp=raw.profile?.xp||0;
 const map={medicin:'medication',peptider:'peptide',bad:'habit',skincare:'skincare',rutine:'habit'};
 Object.entries(raw.items||{}).forEach(([ot,list])=>(list||[]).forEach(old=>{const meta=(old.meta||'').toLowerCase();let times=[];if(meta.includes('morgen'))times=['08:00'];else if(meta.includes('middag'))times=['12:00'];else if(meta.includes('aften'))times=['20:00'];out.items.push({id:old.id||uid(),type:map[ot]||'habit',name:old.name||'Uden navn',dose:(ot==='medicin'||ot==='peptider')?(old.meta||''):'',times,days:[0,1,2,3,4,5,6],notes:(ot==='medicin'||ot==='peptider')?'':(old.meta||''),createdAt:Date.now()-86400000,stockCurrent:null,stockUnit:'',stockPerUse:null,stockLow:null})}));
 (raw.entries||[]).forEach(e=>out.entries.push({id:e.id||uid(),itemId:e.itemId||null,itemName:e.itemName||'',type:map[e.type]||e.type||'note',ts:e.ts||Date.now(),dose:e.value??e.dose??'',note:e.note||'',status:e.status||'taken',scheduleTime:e.scheduleTime??null,stockDelta:e.stockDelta||0})); return out;
}
async function load(){let raw=null;try{raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){}if(!raw){for(const k of OLD_KEYS){try{const v=localStorage.getItem(k);if(v){raw=JSON.parse(v);break}}catch(e){}}}state=normalizeState(raw);save()}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){toast('Kunne ikke gemme data')}}
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}

function levelInfo(){const total=Math.max(0,state.profile.xp||0);let level=1,base=0,need=120;while(total>=base+need){base+=need;level++;need=120+(level-1)*55}const into=total-base;return {level,total,into,need,pct:Math.round(into/need*100)}}
function rankName(level){if(level>=25)return 'OPUS Legend';if(level>=20)return 'Grandmaster';if(level>=15)return 'Master';if(level>=10)return 'Strateg';if(level>=7)return 'Operator';if(level>=4)return 'Explorer';return 'Starter'}
function awardXP(amount,reason,key=null){state.profile.awarded=state.profile.awarded||{};if(key&&state.profile.awarded[key])return 0;if(key)state.profile.awarded[key]=Date.now();state.profile.xp=(state.profile.xp||0)+amount;state.profile.xpHistory=state.profile.xpHistory||[];state.profile.xpHistory.unshift({id:uid(),ts:Date.now(),amount,reason});state.profile.xpHistory=state.profile.xpHistory.slice(0,120);return amount}
function hasActivity(k){return state.entries.some(e=>dateEntry(e)===k&&e.status==='taken')||state.checkins.some(c=>localDateKey(c.ts)===k)}
function computeStreak(){let s=0,d=new Date();if(!hasActivity(localDateKey(d)))d=addDays(d,-1);while(hasActivity(localDateKey(d))&&s<999){s++;d=addDays(d,-1)}return s}
function countPerfectDays(){let c=0;for(let n=0;n<120;n++){const d=addDays(new Date(),-n),comp=completionForDate(d);if(comp.total>0&&comp.taken===comp.total)c++}return c}
function evaluateBonuses(dateKey=localDateKey()){
 let gain=0;const d=dateFromKey(dateKey),comp=completionForDate(d);
 if(comp.total>0&&comp.taken===comp.total)gain+=awardXP(25,'Perfekt dag',`perfect:${dateKey}`);
 const taken=state.entries.filter(e=>dateEntry(e)===dateKey&&e.status==='taken').length;
 if(taken>=3)gain+=awardXP(8,'3 registreringer på én dag',`three:${dateKey}`);
 const streak=computeStreak();const rewards={3:15,7:35,14:70,30:160,60:320,100:600};if(rewards[streak])gain+=awardXP(rewards[streak],`${streak}-dages streak`,`streak:${streak}`);
 return gain;
}

function tasksForDate(date){const d=date instanceof Date?date:dateFromKey(date),dow=d.getDay(),key=localDateKey(d),end=startOfDay(d)+86399999;return state.items.filter(i=>(i.createdAt||0)<=end&&(i.days||[]).includes(dow)).flatMap(item=>(item.times?.length?item.times:[null]).map(time=>({item,time,key}))).sort((a,b)=>String(a.time||'99:99').localeCompare(String(b.time||'99:99')))}
function statusForTask(task,key=task.key){const x=state.entries.filter(e=>e.itemId===task.item.id&&dateEntry(e)===key&&((task.time===null&&!e.scheduleTime)||e.scheduleTime===task.time));if(x.some(e=>e.status==='taken'))return'taken';if(x.some(e=>e.status==='skipped'))return'skipped';return'pending'}
function completionForDate(date){const tasks=tasksForDate(date),key=localDateKey(date instanceof Date?date:dateFromKey(date));if(!tasks.length)return{total:0,taken:0,skipped:0,pct:0};let taken=0,skipped=0;tasks.forEach(t=>{const s=statusForTask(t,key);if(s==='taken')taken++;if(s==='skipped')skipped++});return{total:tasks.length,taken,skipped,pct:Math.round(taken/tasks.length*100)}}
function bucket(t){if(!t)return'any';const h=parseInt(t);return h<11?'morning':h<17?'day':'evening'}
function bucketLabel(b){return b==='morning'?'🌅 Morgen':b==='day'?'☀️ Dag':b==='evening'?'🌙 Aften':'✨ Når det passer'}
function checkinFor(k){return state.checkins.find(c=>localDateKey(c.ts)===k)||null}
function stockInfo(i){const cur=num(i.stockCurrent),per=num(i.stockPerUse),low=num(i.stockLow);if(cur===null)return null;const uses=(i.days?.length||0)*Math.max(1,i.times?.length||1),perDay=per&&uses?per*uses/7:null;return{cur,unit:i.stockUnit||'',daysLeft:perDay?Math.floor(cur/perDay):null,isLow:low!==null&&cur<=low}}

function renderShell(){
 $$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));$('#fab').style.display=(activeTab==='library'||activeTab==='plan')?'block':'none';$('#brandSub').textContent=`DIN PERSONLIGE TRACKER${state.userName?' · '+state.userName:''}`;
 if(activeTab==='today')renderToday();else if(activeTab==='plan')renderPlan();else if(activeTab==='library')renderLibrary();else if(activeTab==='game')renderGame();else renderJournal();
}
function taskHTML(task,key=localDateKey()){
 const i=task.item,m=typeMeta(i.type),s=statusForTask(task,key),symbol=s==='taken'?'✓':s==='skipped'?'–':'+';return `<button class="task ${s==='taken'?'done':s==='skipped'?'skip':''}" style="--accent:${m.color};width:calc(100% - 32px);text-align:left;color:inherit" data-task="${i.id}" data-time="${task.time||''}" data-date="${key}"><span class="check">${symbol}</span><span class="task-copy"><span class="task-name">${esc(i.name)}</span><span class="task-meta">${task.time?task.time+' · ':''}${esc(i.dose||m.label)}${i.notes?' · '+esc(i.notes):''}</span></span><span class="task-xp">+${m.xp} XP</span></button>`}
function renderMissions(){const k=localDateKey(),comp=completionForDate(new Date()),check=!!checkinFor(k),note=state.entries.some(e=>dateEntry(e)===k&&e.type==='note'),all=comp.total>0&&comp.taken===comp.total;const ms=[{i:'🏁',n:'Gennemfør dagen',d:comp.total?`${comp.taken}/${comp.total} færdige`:'Tilføj planer først',r:'+25 XP',ok:all},{i:'🎯',n:'Dagligt check-in',d:'Humør, energi og hud',r:'+12 XP',ok:check},{i:'📝',n:'Skriv en note',d:'Fang én observation',r:'+5 XP',ok:note}];return ms.map(m=>`<div class="mission ${m.ok?'complete':''}"><div class="micon">${m.ok?'✅':m.i}</div><div class="mcopy"><b>${m.n}</b><span>${m.d}</span></div><div class="reward">${m.ok?'KLAR':m.r}</div></div>`).join('')}
function renderToday(){
 const tasks=tasksForDate(new Date()),comp=completionForDate(new Date()),li=levelInfo(),streak=computeStreak(),todayLogs=state.entries.filter(e=>dateEntry(e)===localDateKey()&&e.status==='taken').length,first=state.userName?`, ${esc(state.userName.split(' ')[0])}`:'';const groups={morning:[],day:[],evening:[],any:[]};tasks.forEach(t=>groups[bucket(t.time)].push(t));const grouped=Object.entries(groups).filter(([,v])=>v.length).map(([k,v])=>`<div class="time-label">${bucketLabel(k)}</div>${v.map(t=>taskHTML(t)).join('')}`).join('');
 const c=checkinFor(localDateKey());
 $('#view').innerHTML=`<div class="page-head"><div class="eyebrow">${esc(fmtDateLong()).toUpperCase()}</div><div class="page-title">God dag${first}</div><div class="page-sub">Gør din rutine til et spil. Små registreringer bygger streak, XP og levels.</div></div>
 <div class="card hero"><div class="hero-top"><div><div class="hero-label">Dagens gennemførelse</div><div class="hero-score">${comp.pct}<small>%</small></div></div><div class="level-badge">LV ${li.level} · ${rankName(li.level)}</div></div><div class="bar"><i style="width:${comp.pct}%"></i></div><div class="hero-stats"><div class="hero-stat"><b>${comp.taken}/${comp.total}</b><span>færdige</span></div><div class="hero-stat"><b>${streak}🔥</b><span>streak</span></div><div class="hero-stat"><b>${li.total}</b><span>total XP</span></div></div></div>

function renderGame(){const li=levelInfo(),streak=computeStreak(),perfect=countPerfectDays(),taken=state.entries.filter(e=>e.status==='taken').length,week=weekStats(7),badges=BADGES.map(b=>({...b,ok:b.test(state)}));$('#view').innerHTML=`<div class="page-head"><div class="eyebrow">OPUS GAME</div><div class="page-title">Level up dit liv</div><div class="page-sub">Du får XP for konsistens — ikke for perfekte tal. Registrér, gennemfør planen og hold din streak.</div></div><div class="card game-hero"><div class="game-top"><div class="level-orb" style="--p:${li.pct}"><div class="lv"><b>${li.level}</b><span>LEVEL</span></div></div><div class="rank"><div class="rank-name">${rankName(li.level)}</div><div class="rank-sub">${li.total} total XP · ${li.need-li.into} XP til næste level</div><div class="bar"><i style="width:${li.pct}%"></i></div><div class="xptext">${li.into} / ${li.need} XP</div></div></div></div><div class="metric-grid"><div class="metric"><b>${streak}🔥</b><span>streak</span></div><div class="metric"><b>${perfect}</b><span>perfekte dage</span></div><div class="metric"><b>${taken}</b><span>handlinger</span></div></div><div class="section-head"><h2>Badges</h2><span>${badges.filter(b=>b.ok).length}/${badges.length}</span></div><div class="badges">${badges.map(b=>`<div class="badge ${b.ok?'':'locked'}"><div class="bicon">${b.icon}</div><b>${b.name}</b><span>${b.desc}</span></div>`).join('')}</div><div class="section-head"><h2>Aktivitet · 28 dage</h2><span>${week.adherence}% sidste 7 dage</span></div><div class="card pad"><div class="heat">${heatmapHTML(28)}</div></div><div class="section-head"><h2>7-dages stats</h2><span>trend</span></div><div class="metric-grid"><div class="metric"><b>${week.adherence}%</b><span>adherence</span></div><div class="metric"><b>${week.mood??'–'}</b><span>humør ø</span></div><div class="metric"><b>${week.energy??'–'}</b><span>energi ø</span></div></div><div class="section-head"><h2>Seneste XP</h2><span>${state.profile.xpHistory?.length| function weekStats(days){let planned=0,taken=0;for(let n=0;n<days;n++){const d=addDays(new Date(),-n),c=completionForDate(d);planned+=c.total;taken+=c.taken}const since=startOfDay(addDays(new Date(),-(days-1))),cs=state.checkins.filter(c=>c.ts>=since);return{adherence:planned?Math.round(taken/planned*100):0,mood:cs.length?avg(cs.map(c=>c.mood)).toFixed(1):null,energy:cs.length?avg(cs.map(c=>c.energy)).toFixed(1):null}}
function heatmapHTML(days){let out='';for(let n=days-1;n>=0;n--){const d=addDays(new Date(),-n),k=localDateKey(d),logs=state.entries.filter(e=>dateEntry(e)===k&&e.status==='taken').length+(checkinFor(k)?1:0),cls=logs>=5?'l4':logs>=3?'l3':logs>=1?'l2':hasActivity(k)?'l1':'';out+=`<i class="${cls}" title="${k}: ${logs}"></i>`}return out}

function renderJournal(){const all=journalItems();$('#view').innerHTML=`<div class="page-head"><div class="eyebrow">JOURNAL</div><div class="page-title">Din historik</div><div class="page-sub">Se hvad du faktisk har gjort — og de noter, der forklarer hvordan det gik.</div></div><div class="card pad"><textarea id="journalNote" placeholder="Skriv en observation, plan eller note..."></textarea><div class="sheet-actions"><button class="primary" id="saveNote">Gem note · +5 XP</button><button class="secondary" id="journalPhoto">Foto</button></div></div><div class="search-wrap"><input class="search" id="journalSearch" placeholder="Søg i loggen..."></div><div class="section-head"><h2>Historik</h2><span id="historyCount">${all.length}</span></div><div id="journalList"></div>`;$('#saveNote').onclick=()=>{const note=$('#journalNote').value.trim();if(!note)return toast('Skriv en note først');state.entries.unshift({id:uid(),type:'note',ts:Date.now(),note,status:'taken'});let g=awardXP(TYPES.note.xp,'Journalnote');g+=evaluateBonuses();save();toast(`Note gemt · +${g} XP`);renderJournal()};$('#journalPhoto').onclick=()=>$('#photoInput').click();$('#journalSearch').oninput=renderJournalList;renderJournalList()}
function journalItems(){return [...state.entries.map(e=>({kind:'entry',ts:e.ts,data:e})),...state.checkins.map(c=>({kind:'check',ts:c.ts,data:c}))].sort((a,b)=>b.ts-a.ts)}
function journalText(x){if(x.kind==='check')return `check in humør ${x.data.mood} energi ${x.data.energy} hud ${x.data.skin} ${x.data.note||''}`;const e=x.data;return `${typeMeta(e.type).label} ${e.itemName||''} ${e.dose||''} ${e.note||''} ${e.status||''}`}
function renderJournalList(){const q=$('#journalSearch')?.value.trim().toLowerCase()||'',list=journalItems().filter(x=>!q||journalText(x).toLowerCase().includes(q));$('#historyCount').textContent=list.length;$('#journalList').innerHTML=list.length?list.map(journalHTML).join(''):`<div class="empty">Ingen resultater.</div>`;$$('[data-delentry]').forEach(b=>b.onclick=()=>deleteEntry(b.dataset.delentry));$$('[data-delcheck]').forEach(b=>b.onclick=()=>{state.checkins=state.checkins.filter(c=>c.id!==b.dataset.delcheck);save();renderJournal()})}

$('#itemForm').onsubmit=e=>{e.preventDefault();const name=$('#itemName').value.trim(),days=$$('[data-day].on').map(b=>+b.dataset.day);if(!name)return;if(!days.length)return toast('Vælg mindst én dag');const data={type:$('#itemType').value,name,dose:$('#itemDose').value.trim(),times:parseTimes($('#itemTimes').value),days,notes:$('#itemNotes').value.trim(),stockCurrent:num($('#stockCurrent').value),stockUnit:$('#stockUnit').value.trim(),stockPerUse:num($('#stockPerUse').value),stockLow:num($('#stockLow').value)};if(itemCtx.id){Object.assign(state.items.find(i=>i.id===itemCtx.id),data);toast('Opdateret')}else{state.items.push({id:uid(),createdAt:Date.now(),...data});awardXP(3,'Nyt element tilføjet');toast('Tilføjet · +3 XP')}save();$('#itemDialog').close();renderShell()};$('#itemCancel').onclick=()=>$('#itemDialog').close();$('#fab').onclick=()=>{if(activeTab==='plan'){const d=dateFromKey(selectedDate);openItem(null,'habit',[d.getDay()])}else openItem()};

function openLog(item,scheduleTime=null,dateKey=localDateKey()){logCtx={item,scheduleTime,dateKey};$('#logTitle').textContent=`Log ${item.name}`;$('#logDose').value=item.dose||'';$('#logNote').value='';$('#logTime').value=new Date().toTimeString().slice(0,5);$('#logDialog').showModal()}
function commitLog(status){const {item,scheduleTime,dateKey}=logCtx;if(!item)return;const time=$('#logTime').value||'12:00',[hh,mm]=time.split(':').map(Number),d=dateFromKey(dateKey||localDateKey());d.setHours(hh,mm,0,0);const dup=state.entries.find(e=>e.itemId===item.id&&dateEntry(e)===(dateKey||localDateKey())&&e.scheduleTime===scheduleTime&&(e.status==='taken'||e.status==='skipped'));if(dup){$('#logDialog').close();return toast('Allerede registreret')};const entry={id:uid(),itemId:item.id,itemName:item.name,type:item.type,ts:d.getTime(),dose:$('#logDose').value.trim(),note:$('#logNote').value.trim(),status,scheduleTime,stockDelta:0};let gained=0;if(status==='taken'){const per=num(item.stockPerUse),cur=num(item.stockCurrent);if(per!==null&&cur!==null){item.stockCurrent=Math.max(0,+(cur-per).toFixed(4));entry.stockDelta=per}gained+=awardXP(typeMeta(item.type).xp,`${typeMeta(item.type).label}: ${item.name}`)}state.entries.unshift(entry);if((dateKey||localDateKey())===localDateKey())gained+=evaluateBonuses();save();$('#logDialog').close();toast(status==='taken'?`Registreret · +${gained} XP`:'Sprunget over');renderShell()}
$('#logForm').onsubmit=e=>{e.preventDefault();commitLog('taken')};$('#logSkip').onclick=()=>commitLog('skipped');$('#logCancel').onclick=()=>$('#logDialog').close();
function undoTask(item,time,key){const idx=state.entries.findIndex(e=>e.itemId===item.id&&dateEntry(e)===key&&e.scheduleTime===time&&(e.status==='taken'||e.status==='skipped'));if(idx<0)return;const e=state.entries[idx];if(e.stockDelta)item.stockCurrent=(num(item.stockCurrent)||0)+e.stockDelta;state.entries.splice(idx,1);save();toast('Registrering fjernet');renderShell()}

function openDetail(i){if(!i)return;const m=typeMeta(i.type),s=stockInfo(i),hist=state.entries.filter(e=>e.itemId===i.id).slice(0,7);$('#detailContent').innerHTML=`<h3 style="margin-bottom:4px;color:${m.color}">${m.icon} ${esc(i.name)}</h3><div style="font-size:11px;color:var(--muted)">${m.label} · +${m.xp} XP pr. registrering</div><div class="item-row">${i.dose?`<span class="pill">${esc(i.dose)}</span>`:''}<span class="pill">${esc(scheduleText(i))}</span>${s?`<span class="pill ${s.isLow?'low':''}">Lager ${s.cur}${s.unit?' '+esc(s.unit):''}</span>`:''}</div>${i.notes?`<p style="color:var(--muted);font-size:12px;line-height:1.45">${esc(i.notes)}</p>`:''}<div class="sheet-actions"><button class="primary" id="detailLog">Log nu</button><button class="secondary" id="detailEdit">Redigér</button></div><div class="sheet-actions"><button class="secondary" id="calendarBtn">Apple Kalender</button><button class="danger" id="detailDelete">Slet</button></div><div class="divider"></div><b style="font-size:13px">Seneste</b>${hist.length?hist.map(e=>`<div class="stock-row"><div><div class="stock-name">${e.status==='skipped'?'Sprunget over':'Registreret'}${e.dose?' · '+esc(e.dose):''}</div><div class="stock-meta">${esc(e.note||'Ingen note')}</div></div><div class="stock-value">${fmtDateTime(e.ts)}</div></div>`).join(''):`<p style="color:var(--muted);font-size:12px">Ingen historik endnu.</p>`}<button class="secondary full" id="detailClose" style="margin-top:12px">Luk</button>`;$('#detailDialog').showModal();$('#detailLog').onclick=()=>{$('#detailDialog').close();openLog(i)};$('#detailEdit').onclick=()=>{$('#detailDialog').close();openItem(i)};$('#detailDelete').onclick=()=>{if(confirm(`Slet ${i.name}?`)){state.items=state.items.filter(x=>x.id!==i.id);save();$('#detailDialog').close();renderShell()}};$('#detailClose').onclick=()=>$('#detailDialog').close();$('#calendarBtn').onclick=()=>exportICS(i)}
function nextOccurrence(i,time){const now=new Date();for(let off=0;off<14;off++){const d=addDays(now,off);if(!(i.days||[]).includes(d.getDay()))continue;const [h,m]=(time||'09:00').split(':').map(Number);d.setHours(h,m,0,0);if(d>now)return d}return addDays(now,1)}
function icsDate(d){const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}T${z(d.getHours())}${z(d.getMinutes())}00`}
function exportICS(i){const times=i.times?.length?i.times:['09:00'];let ev='';times.forEach((t,n)=>{const st=nextOccurrence(i,t),en=new Date(st.getTime()+10*60000),rule=(i.days||[]).length===7?'RRULE:FREQ=DAILY':`RRULE:FREQ=WEEKLY;BYDAY=${(i.days||[]).map(d=>DAY_ICS[d]).join(',')}`;ev+=`BEGIN:VEVENT\r\nUID:${i.id}-${n}@opus\r\nDTSTART:${icsDate(st)}\r\nDTEND:${icsDate(en)}\r\n${rule}\r\nSUMMARY:OPUS - ${i.name.replace(/[,;]/g,' ')}\r\nDESCRIPTION:${(i.dose||'').replace(/[,;]/g,' ')}\r\nEND:VEVENT\r\n`});shareBlob(new Blob([`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//OPUS//DA\r\n${ev}END:VCALENDAR`],{type:'text/calendar'}),`${i.name.replace(/[^a-z0-9æøå]+/gi,'-')}.ics`,'OPUS kalender')}

async function initDB(){return new Promise((res,rej)=>{const r=indexedDB.open('opus-media',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('photos'))r.result.createObjectStore('photos',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getPhotos(){try{const db=await initDB();return await new Promise((res,rej)=>{const q=db.transaction('photos','readonly').objectStore('photos').getAll();q.onsuccess=()=>res((q.result||[]).sort((a,b)=>b.ts-a.ts));q.onerror=()=>rej(q.error)})}catch(e){return[]}}
async function putPhoto(p){const db=await initDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(p);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function removePhoto(id){const db=await initDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function compressImage(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8))};img.onerror=rej;img.src=url})}
$('#photoInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;pendingPhoto=f;$('#photoPreview').src=URL.createObjectURL(f);$('#photoNote').value='';$('#photoSkin').value=5;$('#photoSkinOut').textContent='5';$('#photoDialog').showModal();e.target.value=''};$('#photoSkin').oninput=e=>$('#photoSkinOut').textContent=e.target.value;$('#photoCancel').onclick=()=>{$('#photoDialog').close();pendingPhoto=null};$('#photoSave').onclick=async()=>{if(!pendingPhoto)return;try{const dataUrl=await compressImage(pendingPhoto);await putPhoto({id:uid(),ts:Date.now(),dataUrl,skin:+$('#photoSkin').value,note:$('#photoNote').value.trim()});awardXP(4,'Progress-foto');save();$('#photoDialog').close();pendingPhoto=null;toast('Foto gemt · +4 XP');if(activeTab==='game')renderPhotos()}catch(e){toast('Kunne ikke gemme foto')}};
async function renderPhotos(){const area=$('#photosArea');if(!area)return;const p=await getPhotos();area.innerHTML=p.length?`<div class="photo-strip">${p.slice(0,8).map(x=>`<div class="photo"><img src="${x.dataUrl}" alt="Progress-foto"><div class="photo-meta"><b>${fmtDate(x.ts)} · hud ${x.skin}/10</b><p>${esc(x.note||'Ingen note')}</p><button class="mini-btn danger-text" data-delphoto="${x.id}">Slet</button></div></div>`).join('')}</div>`:`<div style="color:var(--muted);font-size:12px">Ingen progress-fotos endnu.</div>`;$$('[data-delphoto]').forEach(b=>b.onclick=async()=>{if(confirm('Slet foto?')){await removePhoto(b.dataset.delphoto);renderPhotos()}})}

async function sha256(s){const data=new TextEncoder().encode(s),h=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function lock(){if(!state.settings.pinHash)return;$('#lockOverlay').classList.add('show');$('#unlockPin').value='';$('#unlockError').textContent='';setTimeout(()=>$('#unlockPin').focus(),100)}
$('#unlockBtn').onclick=async()=>{if(await sha256($('#unlockPin').value)===state.settings.pinHash){$('#lockOverlay').classList.remove('show')}else{$('#unlockError').textContent='Forkert PIN';$('#unlockPin').value=''}};$('#unlockPin').onkeydown=e=>{if(e.key==='Enter')$('#unlockBtn').click()};document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>30000&&state.settings.pinHash)lock()});
$('#settingsBtn').onclick=()=>{$('#userName').value=state.userName||'';$('#pinSet').value='';$('#settingsDialog').showModal()};$('#settingsClose').onclick=()=>$('#settingsDialog').close();$('#saveName').onclick=()=>{state.userName=$('#userName').value.trim();save();toast('Navn gemt');renderShell()};$('#setPin').onclick=async()=>{const p=$('#pinSet').value.trim();if(!/^\d{4}$/.test(p))return toast('PIN skal være 4 cifre');state.settings.pinHash=await sha256(p);save();toast('PIN aktiveret')};$('#removePin').onclick=()=>{state.settings.pinHash=null;save();toast('PIN fjernet')};$('#resetBtn').onclick=async()=>{if(!confirm('Slet alle OPUS-data og fotos?'))return;state=defaultState();save();for(const p of await getPhotos())await removePhoto(p.id);$('#settingsDialog').close();renderShell();toast('Nulstillet')};
async function shareBlob(blob,name,title='OPUS'){const f=new File([blob],name,{type:blob.type});try{if(navigator.canShare?.({files:[f]})){await navigator.share({files:[f],title});return}}catch(e){}const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
$('#exportBtn').onclick=async()=>{const photos=await getPhotos(),blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),state,photos},null,2)],{type:'application/json'});shareBlob(blob,`OPUS-backup-${localDateKey()}.json`,'OPUS backup')};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.state)throw 0;state=normalizeState(data.state);save();for(const p of data.photos||[])await putPhoto(p);$('#settingsDialog').close();renderShell();toast('Backup importeret')}catch(err){toast('Ugyldig backup')}e.target.value=''};
function installHint(){const standalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches,ios=/iPhone|iPad|iPod/.test(navigator.userAgent);if(ios&&!standalone&&!state.settings.hideInstall)$('#installHint').classList.add('show')}$('#hideInstall').onclick=()=>{state.settings.hideInstall=true;save();$('#installHint').classList.remove('show')};
$$('#nav button').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderShell()});
(async()=>{await load();installHint();renderShell();if(state.settings.pinHash)lock()})();
})();
</script>
